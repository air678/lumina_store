<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina | Store</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-main: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #2997ff;
            --glass: rgba(28, 28, 30, 0.85);
            --card-bg: #1d1d1f;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --success: #30d158;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            padding-top: 50px;
        }

        /* --- Navigation --- */
        nav {
            position: fixed; top: 0; width: 100%; height: 50px;
            background: var(--glass); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000; display: flex; justify-content: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .nav-content {
            width: 100%; max-width: 1000px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; font-size: 12px;
        }
        .nav-links a {
            color: #d6d6d6; text-decoration: none; margin: 0 15px; cursor: pointer;
            transition: color 0.3s; opacity: 0.8; position: relative;
        }
        .nav-links a:hover { color: white; opacity: 1; }
        .logo { font-weight: 600; font-size: 16px; color: #fff; text-decoration: none; cursor: pointer; }
        
        .bag-count {
            background: var(--accent); color: white; padding: 1px 5px;
            border-radius: 10px; font-size: 10px; position: absolute;
            top: -5px; right: -8px; opacity: 0; transition: opacity 0.3s;
        }
        .bag-count.visible { opacity: 1; }

        /* --- VIEWS --- */
        .view-section {
            display: none; /* All views hidden by default */
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .view-section.active { display: block; }

        /* --- HERO SECTION --- */
        .hero {
            height: 95vh; position: relative;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; overflow: hidden;
        }
        
        .hero-image-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; opacity: 0.6;
        }
        
        .hero-img {
            width: 100%; height: 100%; object-fit: cover; object-position: center;
            transform: scale(1.1);
        }

        /* Gradient Overlay to blend hero image into black body */
        .hero-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 60%;
            background: linear-gradient(to bottom, transparent 0%, #000000 100%);
            z-index: 1;
        }

        .hero-content { z-index: 2; position: relative; margin-top: -50px; }
        
        .hero h1 {
            font-size: 5rem; font-weight: 700; letter-spacing: -3px; color: #ffffff;
            text-shadow: 0 10px 40px rgba(0,0,0,0.8); margin-bottom: 10px;
        }
        
        .hero p { 
            font-size: 1.7rem; color: #e0e0e0; margin-bottom: 25px; 
            text-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }

        .hero-links a {
            color: var(--accent); font-size: 1.2rem; text-decoration: none; margin: 0 15px;
        }
        .hero-links a:hover { text-decoration: underline; }

        /* --- PRODUCTS GRID --- */
        .products-container { padding: 50px 20px; max-width: 1200px; margin: 0 auto; background: #000; position: relative; z-index: 2; }
        .section-header { font-size: 3rem; font-weight: 700; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 25px; }
        
        .card {
            background: var(--card-bg); height: 500px; border-radius: 24px;
            position: relative; overflow: hidden; cursor: pointer;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: scale(1.02); }
        .card:hover .card-img { opacity: 1; }

        .card-content { 
            position: absolute; top: 40px; width: 100%; text-align: center; z-index: 3; 
            padding: 0 20px;
        }
        /* Heavy text shadow to fix visibility issues on light images */
        .card h3 { 
            font-size: 2rem; margin-bottom: 5px; color: #fff; 
            text-shadow: 0 4px 15px rgba(0,0,0,0.9); 
        }
        .card p { 
            color: #f0f0f0; font-weight: 500;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }
        .card-price { 
            color: var(--accent); margin-top: 10px; font-weight: 600; 
            text-shadow: 0 2px 10px rgba(0,0,0,1);
        }

        .card-img {
            width: 100%; height: 100%; object-fit: cover;
            position: absolute; top: 0; left: 0; z-index: 1;
            /* Dimmed slightly by default so text pops */
            opacity: 0.85; 
            transition: opacity 0.4s ease;
        }

        /* --- PRODUCT DETAIL VIEW --- */
        .product-page { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        .back-btn { color: var(--text-secondary); cursor: pointer; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 5px; transition: color 0.2s; }
        .back-btn:hover { color: var(--accent); }
        .product-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; }
        .product-gallery {
            position: sticky; top: 80px; height: 500px; background: #111;
            border-radius: 20px; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .product-gallery img { max-width: 100%; max-height: 100%; object-fit: cover; }
        .product-info h1 { font-size: 3rem; line-height: 1.1; margin-bottom: 10px; }
        .product-info .price { font-size: 1.5rem; color: var(--text-secondary); margin-bottom: 30px; }
        .option-group { margin-bottom: 30px; }
        .option-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; }
        .colors { display: flex; gap: 15px; }
        .color-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.2s; }
        .color-dot:hover { transform: scale(1.1); }
        .color-dot.selected { border-color: var(--accent); padding: 2px; background-clip: content-box; }
        .storage-options { display: flex; flex-direction: column; gap: 10px; }
        .storage-btn {
            padding: 20px; border: 1px solid #424245; border-radius: 12px;
            background: transparent; color: white; text-align: left; cursor: pointer;
            display: flex; justify-content: space-between; transition: border-color 0.2s;
        }
        .storage-btn:hover { border-color: #888; }
        .storage-btn.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        .add-btn {
            width: 100%; padding: 18px; background: var(--accent); color: white;
            border: none; border-radius: 12px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: background 0.2s; margin-top: 20px;
        }
        .add-btn:hover { background: #147ceb; }

        /* --- SHOPPING BAG VIEW --- */
        .bag-page { max-width: 800px; margin: 0 auto; padding: 60px 20px; }
        .bag-title { font-size: 2.5rem; font-weight: 700; margin-bottom: 40px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .empty-bag { text-align: center; color: var(--text-secondary); padding: 50px 0; font-size: 1.2rem; }
        
        .bag-item { display: flex; gap: 20px; padding: 25px 0; border-bottom: 1px solid #222; align-items: center; }
        .bag-item img { width: 80px; height: 80px; object-fit: cover; background: #111; border-radius: 10px; }
        .item-details { flex-grow: 1; }
        .item-name { font-size: 1.2rem; font-weight: 600; color: #fff; }
        .item-spec { color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px; }
        .item-price { font-size: 1.1rem; font-weight: 500; }
        .remove-btn { color: var(--accent); cursor: pointer; font-size: 0.9rem; margin-top: 5px; display: inline-block; }
        .remove-btn:hover { text-decoration: underline; }

        .bag-summary { margin-top: 40px; text-align: right; }
        .total-row { font-size: 1.5rem; font-weight: 600; margin-bottom: 20px; }
        .checkout-btn {
            padding: 15px 40px; background: var(--success); color: white;
            border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
            cursor: pointer;
        }

        /* --- LOGIN MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(15px);
            z-index: 2000; display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .login-card {
            background: #1c1c1e; width: 380px; padding: 40px; border-radius: 20px;
            text-align: center; border: 1px solid #333; transform: scale(0.9); transition: 0.3s;
        }
        .modal-overlay.active .login-card { transform: scale(1); }
        .input-group input {
            width: 100%; background: #2c2c2e; border: 1px solid #424245;
            padding: 15px; margin-bottom: 15px; border-radius: 10px; color: white; outline: none;
        }
        .input-group input:focus { border-color: var(--accent); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            .hero h1 { font-size: 3.5rem; }
            .product-layout { grid-template-columns: 1fr; }
            .product-gallery { position: relative; top: 0; height: 300px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-content">
            <a onclick="switchView('home')" class="logo">Lumina</a>
            <div class="nav-links">
                <a onclick="switchView('home')">Store</a>
                <a onclick="switchView('home')">Mac</a>
                <a onclick="switchView('home')">iPhone</a>
                <a onclick="openLogin()">Account</a>
                <a onclick="switchView('bag')">Bag <span id="bagCount" class="bag-count">0</span></a>
            </div>
        </div>
    </nav>

    <div id="homeView" class="view-section active">
        <section class="hero">
            <div class="hero-image-container">
                <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2000&auto=format&fit=crop" class="hero-img" alt="Background">
            </div>
            <div class="hero-overlay"></div>
            
            <div class="hero-content">
                <h1>Lumina Vision.</h1>
                <p>Pro-grade optics. Titanium finish.</p>
                <div class="hero-links">
                    <a onclick="document.querySelector('.products-container').scrollIntoView()">Learn more ></a>
                    <a onclick="document.querySelector('.products-container').scrollIntoView()">Buy ></a>
                </div>
            </div>
        </section>

        <section class="products-container">
            <h2 class="section-header">The Latest.</h2>
            <div class="grid" id="productGrid"></div>
        </section>
    </div>

    <div id="productView" class="view-section">
        <div class="product-page">
            <div class="back-btn" onclick="switchView('home')">← Back to Store</div>
            <div class="product-layout">
                <div class="product-gallery"><img id="detailImg" src="" alt="Product"></div>
                <div class="product-info">
                    <h1 id="detailTitle">Product Name</h1>
                    <p class="price" id="detailPrice">$999</p>
                    
                    <div class="option-group">
                        <div class="option-title">FINISH</div>
                        <div class="colors">
                            <div class="color-dot selected" style="background:#333;" onclick="selectColor(this)"></div>
                            <div class="color-dot" style="background:#e3e3e3;" onclick="selectColor(this)"></div>
                            <div class="color-dot" style="background:#2997ff;" onclick="selectColor(this)"></div>
                        </div>
                    </div>

                    <div class="option-group">
                        <div class="option-title">STORAGE</div>
                        <div class="storage-options">
                            <div class="storage-btn selected" onclick="selectStorage(this, 0)">
                                <span class="storage-size">256GB</span><span class="storage-price">Base</span>
                            </div>
                            <div class="storage-btn" onclick="selectStorage(this, 200)">
                                <span class="storage-size">512GB</span><span class="storage-price">+$200</span>
                            </div>
                            <div class="storage-btn" onclick="selectStorage(this, 400)">
                                <span class="storage-size">1TB</span><span class="storage-price">+$400</span>
                            </div>
                        </div>
                    </div>

                    <button class="add-btn" id="addToBagBtn" onclick="addToBag()">Add to Bag</button>
                </div>
            </div>
        </div>
    </div>

    <div id="bagView" class="view-section">
        <div class="bag-page">
            <div class="bag-title">Your Bag.</div>
            <div id="bagItems">
                <div class="empty-bag">Your bag is empty.</div>
            </div>
            
            <div class="bag-summary" id="bagSummary" style="display:none;">
                <div class="total-row">Total: <span id="bagTotal">$0</span></div>
                <button class="checkout-btn" onclick="alert('Proceeding to Checkout...')">Check Out</button>
            </div>
            
            <div style="margin-top: 40px;">
                <span class="back-btn" onclick="switchView('home')">← Continue Shopping</span>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="loginOverlay">
        <div class="login-card">
            <h2 style="margin-bottom:20px;">Lumina ID</h2>
            <form onsubmit="event.preventDefault(); handleLogin();">
                <div class="input-group"><input type="email" placeholder="Email" required></div>
                <div class="input-group"><input type="password" placeholder="Password" required></div>
                <button class="add-btn" type="submit" id="loginBtn">Sign In</button>
            </form>
            <p style="margin-top:20px; color:#86868b; font-size:12px; cursor:pointer;" onclick="closeLogin()">Cancel</p>
        </div>
    </div>

    <script>
        // --- DATA WITH FIXED IMAGES ---
        const products = [
            { 
                id: 1, 
                name: "Lumina Phone 15 Pro", 
                desc: "The ultimate.", 
                price: 999, 
                // Dark product shot (Back of phone)
                img: "https://images.unsplash.com/photo-1678685888221-cda773a3dcdb?q=80&w=1000&auto=format&fit=crop" 
            },
            { 
                id: 2, 
                name: "Lumina Book Air", 
                desc: "Lean. Mean.", 
                price: 1199, 
                // Dark premium laptop shot
                img: "https://images.unsplash.com/photo-1611186871348-b1ce696e52c9?q=80&w=1000&auto=format&fit=crop" 
            },
            { 
                id: 3, 
                name: "Lumina Watch Ultra", 
                desc: "Adventure.", 
                price: 799, 
                // Black watch
                img: "https://images.unsplash.com/photo-1544117519-31a4b719223d?q=80&w=1000&auto=format&fit=crop" 
            },
            { 
                id: 4, 
                name: "Lumina Studio", 
                desc: "Big picture.", 
                price: 1599, 
                // Dark desk setup - text will pop now
                img: "https://images.unsplash.com/photo-1593640408182-31c70c8268f5?q=80&w=1000&auto=format&fit=crop" 
            },
            { 
                id: 5, 
                name: "Lumina Pads", 
                desc: "Pure sound.", 
                price: 549, 
                // Headphones
                img: "https://images.unsplash.com/photo-1546435770-a3e426bf472b?q=80&w=1000&auto=format&fit=crop" 
            },
            { 
                id: 6, 
                name: "Lumina Vision", 
                desc: "Spatial.", 
                price: 3499, 
                // Fixed Link: VR Headset
                img: "https://images.unsplash.com/photo-1622979135228-56a9361f3631?q=80&w=1000&auto=format&fit=crop" 
            }
        ];

        let cart = [];
        let currentProduct = null;
        let selectedPrice = 0;
        let selectedStorage = "256GB";

        // --- INIT ---
        const grid = document.getElementById('productGrid');
        products.forEach(p => {
            grid.innerHTML += `
                <div class="card" onclick="openProduct(${p.id})">
                    <div class="card-content">
                        <h3>${p.name}</h3><p>${p.desc}</p><div class="card-price">From $${p.price}</div>
                    </div>
                    <img src="${p.img}" class="card-img" alt="${p.name}">
                </div>
            `;
        });

        // --- NAVIGATION ---
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            if(viewId === 'home') document.getElementById('homeView').classList.add('active');
            if(viewId === 'bag') {
                renderBag();
                document.getElementById('bagView').classList.add('active');
            }
            window.scrollTo(0, 0);
        }

        // --- PRODUCT DETAILS ---
        function openProduct(id) {
            currentProduct = products.find(p => p.id === id);
            selectedPrice = currentProduct.price;
            selectedStorage = "256GB"; // Reset storage

            // UI Updates
            document.getElementById('detailTitle').innerText = currentProduct.name;
            document.getElementById('detailPrice').innerText = `$${selectedPrice}`;
            document.getElementById('detailImg').src = currentProduct.img;
            
            // Reset Buttons
            document.querySelectorAll('.storage-btn').forEach(b => b.classList.remove('selected'));
            document.querySelectorAll('.storage-btn')[0].classList.add('selected');
            const btn = document.getElementById('addToBagBtn');
            btn.innerText = "Add to Bag";
            btn.style.background = "var(--accent)";

            // Switch View
            document.getElementById('homeView').classList.remove('active');
            document.getElementById('productView').classList.add('active');
            window.scrollTo(0, 0);
        }

        function selectStorage(el, extra) {
            document.querySelectorAll('.storage-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedPrice = currentProduct.price + extra;
            selectedStorage = el.querySelector('.storage-size').innerText;
            document.getElementById('detailPrice').innerText = `$${selectedPrice}`;
        }

        function selectColor(el) {
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
            el.classList.add('selected');
        }

        // --- CART LOGIC ---
        function addToBag() {
            const item = {
                id: Date.now(),
                name: currentProduct.name,
                price: selectedPrice,
                storage: selectedStorage,
                img: currentProduct.img
            };
            
            cart.push(item);
            updateCartCount();

            const btn = document.getElementById('addToBagBtn');
            btn.innerText = "Added to Bag";
            btn.style.background = "#30d158";
            
            setTimeout(() => {
                switchView('bag');
            }, 600);
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartCount();
            renderBag();
        }

        function updateCartCount() {
            const el = document.getElementById('bagCount');
            el.innerText = cart.length;
            if(cart.length > 0) el.classList.add('visible');
            else el.classList.remove('visible');
        }

        function renderBag() {
            const container = document.getElementById('bagItems');
            const summary = document.getElementById('bagSummary');
            
            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-bag">Your bag is empty.</div>';
                summary.style.display = 'none';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price;
                html += `
                    <div class="bag-item">
                        <img src="${item.img}" alt="${item.name}">
                        <div class="item-details">
                            <div class="item-name">${item.name}</div>
                            <div class="item-spec">${item.storage}</div>
                            <div class="remove-btn" onclick="removeFromCart(${item.id})">Remove</div>
                        </div>
                        <div class="item-price">$${item.price}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('bagTotal').innerText = `$${total}`;
            summary.style.display = 'block';
        }

        // --- LOGIN ---
        function openLogin() { document.getElementById('loginOverlay').classList.add('active'); }
        function closeLogin() { document.getElementById('loginOverlay').classList.remove('active'); }
        function handleLogin() {
            const btn = document.getElementById('loginBtn');
            btn.innerText = "Success";
            btn.style.background = "#30d158";
            setTimeout(() => { closeLogin(); btn.innerText="Sign In"; btn.style.background="var(--accent)"; }, 1000);
        }
    </script>
</body>
</html>
